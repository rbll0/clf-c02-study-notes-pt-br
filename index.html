<!doctype html>
<html lang="pt-BR">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Estudo CLF-C02</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Schibsted+Grotesk:wght@400;500;700&family=JetBrains+Mono:wght@500&display=swap">
<style>
  /* Layout: single column reading list, sticky toolbar, row per course section */
  :root {
    --bg: #f2f5f7;
    --surface: #ffffff;
    --ink: #17222d;
    --muted: #5b6b79;
    --line: #d9e1e7;
    --accent: #0b6e69;
    --accent-ink: #ffffff;
    --accent-soft: #dcf0ee;
    --done: #8a98a5;
    --font-body: "Schibsted Grotesk", system-ui, -apple-system, "Segoe UI", sans-serif;
    --font-num: "JetBrains Mono", ui-monospace, "SF Mono", Menlo, monospace;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #10171e;
      --surface: #18212a;
      --ink: #e6edf3;
      --muted: #94a3b1;
      --line: #28343f;
      --accent: #4fc3bb;
      --accent-ink: #08201e;
      --accent-soft: #163532;
      --done: #647584;
      color-scheme: dark;
    }
  }
  :root[data-theme="dark"] {
    --bg: #10171e;
    --surface: #18212a;
    --ink: #e6edf3;
    --muted: #94a3b1;
    --line: #28343f;
    --accent: #4fc3bb;
    --accent-ink: #08201e;
    --accent-soft: #163532;
    --done: #647584;
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  body {
    background: var(--bg);
    color: var(--ink);
    font-family: var(--font-body);
    font-size: 16px;
    line-height: 1.5;
    margin: 0;
    padding-inline: 16px;
    padding-block: 32px 64px;
  }
  main { max-width: 760px; margin-inline: auto; }
  header { display: grid; gap: 8px; margin-bottom: 24px; }
  .eyebrow {
    font-family: var(--font-num);
    font-size: 12px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--accent);
  }
  h1 { font-size: clamp(28px, 6vw, 40px); line-height: 1.1; margin: 0; text-wrap: balance; }
  header p { color: var(--muted); margin: 0; max-width: 60ch; }

  .progress { display: grid; gap: 8px; margin-bottom: 24px; }
  .progress-top { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
  .progress-label { font-size: 14px; color: var(--muted); }
  .progress-label strong { color: var(--ink); font-variant-numeric: tabular-nums; }
  .bar { height: 8px; background: var(--line); border-radius: 4px; overflow: hidden; }
  .bar-fill { height: 100%; width: 0; background: var(--accent); transition: width 0.25s ease; }
  .resume {
    font: inherit;
    font-size: 14px;
    font-weight: 700;
    color: var(--accent-ink);
    background: var(--accent);
    border-radius: 6px;
    padding: 8px 14px;
    text-decoration: none;
  }
  .resume[hidden] { display: none; }

  .toolbar {
    position: sticky;
    top: env(safe-area-inset-top, 0px);
    background: var(--bg);
    padding-block: 8px;
    margin-bottom: 8px;
    z-index: 2;
  }
  .toolbar input {
    width: 100%;
    font: inherit;
    color: var(--ink);
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 6px;
    padding: 10px 12px;
  }
  .toolbar input::placeholder { color: var(--muted); }

  ol { list-style: none; margin: 0; padding: 0; display: grid; gap: 8px; }
  li {
    display: grid;
    grid-template-columns: auto 1fr auto;
    align-items: center;
    gap: 12px;
    background: var(--surface);
    border: 1px solid var(--line);
    border-radius: 8px;
    padding: 12px 14px;
  }
  li[hidden] { display: none; }
  .num { font-family: var(--font-num); font-size: 14px; color: var(--accent); min-width: 2ch; }
  .body { min-width: 0; }
  .body a {
    color: var(--ink);
    font-weight: 700;
    text-decoration: none;
    overflow-wrap: anywhere;
  }
  .body a:hover, .body a:focus-visible { color: var(--accent); text-decoration: underline; }
  .body a::after { content: ""; position: absolute; inset: 0; }
  li { position: relative; }
  .sub { display: block; font-size: 14px; color: var(--muted); }
  .check { position: relative; z-index: 1; display: flex; align-items: center; gap: 6px; font-size: 13px; color: var(--muted); cursor: pointer; }
  .check input { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; margin: 0; }
  li.read { background: transparent; }
  li.read .body a, li.read .num { color: var(--done); }
  li:focus-within { outline: 2px solid var(--accent); outline-offset: 2px; }
  a:focus-visible, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

  .empty { color: var(--muted); padding: 24px 0; text-align: center; }
  .empty[hidden] { display: none; }
  footer { margin-top: 32px; font-size: 13px; color: var(--muted); }
  footer button {
    font: inherit; font-size: 13px; color: var(--muted); background: none;
    border: 1px solid var(--line); border-radius: 6px; padding: 6px 10px; cursor: pointer;
  }

  @media (max-width: 480px) {
    .check span { display: none; }
  }
</style>

<main>
  <header>
    <span class="eyebrow">AWS Certified Cloud Practitioner · CLF-C02</span>
    <h1>Estudo CLF-C02</h1>
    <p>Resumos visuais do curso, uma página por seção. Marque cada uma como lida e busque por qualquer serviço.</p>
  </header>

  <section class="progress" aria-label="Progresso">
    <div class="progress-top">
      <span class="progress-label"><strong id="doneCount">0</strong> de <strong id="totalCount">0</strong> seções lidas</span>
      <a id="resume" class="resume" href="#" hidden>Continuar</a>
    </div>
    <div class="bar" role="progressbar" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0" id="bar"><div class="bar-fill" id="barFill"></div></div>
  </section>

  <div class="toolbar">
    <input id="search" type="search" placeholder="Buscar serviço ou seção (ex.: SQS, Lambda, billing)" aria-label="Buscar">
  </div>

  <ol id="list"></ol>
  <p class="empty" id="empty" hidden>Nada encontrado para essa busca.</p>

  <footer>
    <button type="button" id="reset">Limpar marcações</button>
  </footer>
</main>

<script>
  const SECTIONS = [
    { id: "00", file: "00-visao-geral-clf-c02.html", title: "AWS Cloud Practitioner (CLF-C02)", sub: "Os conceitos que caem na prova, por domínio" },
    { id: "03", file: "03-what-is-cloud-computing.html", title: "O que é Cloud Computing?", sub: "Do datacenter próprio à nuvem AWS" },
    { id: "04", file: "04-iam.html", title: "IAM — Identity and Access Management", sub: "Quem pode fazer o quê na sua conta AWS" },
    { id: "05", file: "05-ec2.html", title: "EC2 — Elastic Compute Cloud", sub: "Servidores virtuais na AWS (IaaS)" },
    { id: "06", file: "06-ec2-instance-storage.html", title: "EC2 Instance Storage", sub: "Onde a instância guarda dados: EBS, EFS, Instance Store" },
    { id: "07", file: "07-elb-asg.html", title: "ELB e ASG", sub: "Elastic Load Balancing e Auto Scaling Groups" },
    { id: "08", file: "08-s3.html", title: "Amazon S3", sub: "Simple Storage Service" },
    { id: "09", file: "09-databases-analytics.html", title: "Databases e Analytics", sub: "RDS, Aurora, DynamoDB, Redshift, Athena e mais" },
    { id: "10", file: "10-other-compute.html", title: "Outros serviços de computação", sub: "ECS, Fargate, ECR, EKS, Lambda, Batch e Lightsail" },
    { id: "11", file: "11-deployments-infra.html", title: "Deployments e infraestrutura em escala", sub: "CloudFormation, CDK, Beanstalk, CodeSuite e Systems Manager" },
    { id: "12", file: "12-global-infrastructure.html", title: "Infraestrutura global da AWS", sub: "Regiões, AZs, edge, Route 53, CloudFront e híbrido" },
    { id: "13", file: "13-cloud-integrations.html", title: "Cloud Integrations", sub: "SQS, SNS, Kinesis, MQ, EventBridge e Step Functions" },
    { id: "14", file: "14-cloud-monitoring.html", title: "Cloud Monitoring", sub: "CloudWatch, EventBridge, CloudTrail, X-Ray, Config e Health" },
    { id: "15", file: "15-vpc-networking.html", title: "VPC e Networking", sub: "VPC, subnets, gateways, firewalls e conexões híbridas" },
    { id: "16", file: "16-security-compliance.html", title: "Segurança e Compliance", sub: "Responsabilidade compartilhada, proteção, criptografia e detecção" },
    { id: "17", file: "17-machine-learning.html", title: "Machine Learning", sub: "Serviços de IA, SageMaker e IA generativa" },
    { id: "18", file: "18-account-billing-support.html", title: "Contas, Billing e Suporte", sub: "Organizations, modelos de preço, ferramentas de custo e planos de suporte" },
    { id: "19", file: "19-advanced-identity.html", title: "Advanced Identity", sub: "Identity Center, Cognito, Directory Services, STS e RAM" },
    { id: "20", file: "20-other-services.html", title: "Other Services", sub: "Migração de dados, arquivos, backup, desktops, apps e mídia" },
    { id: "21", file: "21-architecting-ecosystem.html", title: "Architecting e Ecossistema", sub: "Well-Architected, CAF, migração e recursos de apoio" },
    { id: "22", file: "22-preparing-exam.html", title: "Preparando para a prova", sub: "Formato, estratégia, mapa gatilho → serviço e checklist final" }
  ];

  const STORAGE_KEY = "clf-c02-read";
  let readIds = new Set();

  function loadRead() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      if (raw) readIds = new Set(JSON.parse(raw));
    } catch (error) { readIds = new Set(); }
  }

  function saveRead() {
    try { localStorage.setItem(STORAGE_KEY, JSON.stringify([...readIds])); } catch (error) {}
  }

  const listEl = document.getElementById("list");
  const searchEl = document.getElementById("search");
  const emptyEl = document.getElementById("empty");

  function buildList() {
    const fragment = document.createDocumentFragment();
    SECTIONS.forEach((section) => {
      const item = document.createElement("li");
      item.dataset.id = section.id;
      item.dataset.search = (section.id + " " + section.title + " " + section.sub).toLowerCase();

      const num = document.createElement("span");
      num.className = "num";
      num.textContent = section.id;

      const body = document.createElement("div");
      body.className = "body";
      const link = document.createElement("a");
      link.href = section.file;
      link.textContent = section.title;
      const sub = document.createElement("span");
      sub.className = "sub";
      sub.textContent = section.sub;
      body.append(link, sub);

      const label = document.createElement("label");
      label.className = "check";
      const checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.id = "read-" + section.id;
      checkbox.setAttribute("aria-label", "Marcar seção " + section.id + " como lida");
      checkbox.addEventListener("change", () => {
        if (checkbox.checked) readIds.add(section.id); else readIds.delete(section.id);
        saveRead();
        refresh();
      });
      const text = document.createElement("span");
      text.textContent = "lida";
      label.append(checkbox, text);

      item.append(num, body, label);
      fragment.append(item);
    });
    listEl.append(fragment);
  }

  function refresh() {
    let doneCount = 0;
    let firstUnread = null;
    SECTIONS.forEach((section) => {
      const item = listEl.querySelector('[data-id="' + section.id + '"]');
      const isRead = readIds.has(section.id);
      item.classList.toggle("read", isRead);
      item.querySelector("input").checked = isRead;
      if (isRead) doneCount += 1;
      else if (!firstUnread) firstUnread = section;
    });
    const total = SECTIONS.length;
    const percent = Math.round((doneCount / total) * 100);
    document.getElementById("doneCount").textContent = doneCount;
    document.getElementById("totalCount").textContent = total;
    document.getElementById("barFill").style.width = percent + "%";
    document.getElementById("bar").setAttribute("aria-valuenow", percent);

    const resume = document.getElementById("resume");
    if (firstUnread) {
      resume.hidden = false;
      resume.href = firstUnread.file;
      resume.textContent = (doneCount === 0 ? "Começar pela " : "Continuar na ") + firstUnread.id;
    } else {
      resume.hidden = true;
    }
  }

  function applyFilter() {
    const terms = searchEl.value.toLowerCase().split(/\s+/).filter(Boolean);
    let visible = 0;
    listEl.querySelectorAll("li").forEach((item) => {
      const matches = terms.every((term) => item.dataset.search.includes(term));
      item.hidden = !matches;
      if (matches) visible += 1;
    });
    emptyEl.hidden = visible > 0;
  }

  searchEl.addEventListener("input", applyFilter);
  document.getElementById("reset").addEventListener("click", () => {
    readIds = new Set();
    saveRead();
    refresh();
  });

  loadRead();
  buildList();
  refresh();
</script>
